# agents/openai.yaml — Codex-specific UI metadata for paper-agent skill
# Reference: https://developers.openai.com/codex/skills

interface:
  display_name: "Paper Agent"
  short_description: "Academic paper search, fetch, and lit-review synthesis"
  # icon paths are optional; if you have logo assets, place them in assets/
  # icon_small: "./assets/small-logo.svg"
  # icon_large: "./assets/large-logo.png"
  # brand_color: "#1E40AF"  # paper-agent blue (when icons are added)
  default_prompt: |
    Use the paper-agent skill to help with academic paper research.
    Typical workflows: search for papers, fetch PDFs by DOI, build a
    literature review from a BibTeX file, or check API key status.

policy:
  # When false, Codex won't auto-invoke based on user prompt matching;
  # explicit $paper-agent invocation still works.
  # Default is true (auto-invoke). We keep it true because the
  # description is precise enough to avoid false matches.
  allow_implicit_invocation: true

dependencies:
  # Required system tools
  tools:
    - type: "system"
      value: "python>=3.10"
    - type: "system"
      value: "pip"  # for installing paper-agent
  # Optional: paper-agent's own dependencies
  # - type: "python_package"
  #   value: "playwright"  # for JATS-to-PDF render (v3.9.21+)
  # - type: "python_package"
  #   value: "bibtexparser"  # for fetch-batch

# Optional: explicit list of scripts Codex can invoke
# This makes the skill surface the 8 scripts in the Codex UI selector
scripts:
  - name: "search"
    path: "./scripts/search.py"
    description: "Search 7 academic engines (Crossref, OpenAlex, S2, arXiv, AMiner, CNKI, PubMed)"
  - name: "fetch"
    path: "./scripts/fetch.py"
    description: "Fetch a single paper PDF by DOI (14 fallback channels)"
  - name: "fetch_batch"
    path: "./scripts/fetch_batch.py"
    description: "Batch fetch PDFs from a BibTeX file"
  - name: "review"
    path: "./scripts/review.py"
    description: "Synthesize a literature review from a corpus"
  - name: "citations"
    path: "./scripts/citations.py"
    description: "Walk citation graph (forward + backward) via OpenAlex"
  - name: "keys"
    path: "./scripts/keys.py"
    description: "Manage API keys for academic databases"
  - name: "cache"
    path: "./scripts/cache.py"
    description: "Manage local PDF + metadata cache"
  - name: "version"
    path: "./scripts/version.py"
    description: "Show paper-agent version and dependency status"
