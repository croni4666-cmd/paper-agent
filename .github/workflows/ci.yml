name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check
      - name: Run formal test suite
        run: python -m pytest -q

  browser:
    name: Chromium integration (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PA_TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with browser support
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[browser]" pytest
          python -m pip check
      - name: Install matching Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run suite including real Chromium integration
        run: python -m pytest -q -rs

  package:
    name: Build and resolve dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Resolve declared requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

  dependency-audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit requirements
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt
