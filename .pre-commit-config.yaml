# Pre-commit hook configuration for paper-agent
# https://pre-commit.com/
#
# Install:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
#
# Hooks run on every `git commit`. Add new checks under `hooks:`.

repos:
  # === Standard hooks ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key

  # === Python: pyflakes (fast lint) ===
  - repo: https://github.com/PyCQA/pyflakes
    rev: 3.2.0
    hooks:
      - id: pyflakes
        files: ^pa_cli/.*\.py$

  # === Privacy + personal info scan ===
  - repo: local
    hooks:
      - id: paper-agent-privacy-scan
        name: paper-agent personal info scan
        entry: |
          python -c '
          import subprocess, sys, re, os
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          user_path_re = re.compile(r"[a-zA-Z]:[\\\\/]Users[\\\\/](?!paper-agent)[a-zA-Z0-9_-]+", re.I)
          patterns = []
          if os.path.exists(".privacy_patterns"):
              patterns = [p.strip() for p in open(".privacy_patterns", encoding="utf-8") if p.strip()]
          for f in files:
              try:
                  content = open(f, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              if user_path_re.search(content):
                  print(f"FAIL: local Windows user path found in {f}")
                  sys.exit(1)
              for pat in patterns:
                  if pat in content:
                      print(f"FAIL: private pattern match in {f}")
                      sys.exit(1)
          print("OK: no personal info leaks")
          '
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
